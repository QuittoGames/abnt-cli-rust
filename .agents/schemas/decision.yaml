# Schema: decision.yaml
#
# Schema canônico para registro de uma decisão tomada durante a pesquisa.
# Produzido por research-refactor-agent quando uma escolha significativa
# é feita (ex: aceitar fonte LOW_CONFIDENCE, escolher entre abordagens).

# Campos:
#   decision_id              obrigatório  string  único (D001, D002, ...)
#   timestamp                obrigatório  date    ISO 8601
#   context                  obrigatório  string  contexto da decisão
#   related_task_id          opcional     string  ID da task
#   related_source_ids       opcional     list[string]  IDs das fontes
#   options                  obrigatório  list[object]
#     option                 obrigatório  string
#     pros                   obrigatório  list[string]
#     cons                   obrigatório  list[string]
#     evidence_basis         opcional     string
#   proposal                 obrigatório  string
#   proposal_rationale       obrigatório  string
#   decision                 obrigatório  string
#   decided_by               obrigatório  enum    [user, agent, consensus]
#   decision_date            obrigatório  date    ISO 8601
#   consequences             obrigatório  list[string]
#   risks                    opcional     list[string]
#   mitigations              opcional     list[string]
#   status                   obrigatório  enum    [proposed, accepted, rejected, superseded, on_hold]
#   supersedes               opcional     string  decision_id que esta substitui
#   superseded_by            opcional     string  calculado (não input)

# Valores válidos para enums:
#
#   decided_by: [user, agent, consensus]
#   status: [proposed, accepted, rejected, superseded, on_hold]

# ============================================================
# Exemplo completo (válido YAML, descomentar para usar)
# ============================================================

