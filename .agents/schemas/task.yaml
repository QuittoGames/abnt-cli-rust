# Schema: task.yaml
#
# Schema canônico para registro de uma task do workflow.
# Produzido por workflow-orchestrator (usando graph-engineering skill).
# Persistido em .agents/graph/tasks.json.

# Campos:
#   task_id                       obrigatório  string  único (T001, T002, ...)
#   title                         obrigatório  string
#   status                        obrigatório  enum
#   priority                      obrigatório  enum
#   mode                          obrigatório  enum
#   owner                         obrigatório  enum    [human, agent, shared]
#   agent_assigned                opcional     string
#   dependencies                  opcional     list[string]
#   parallel_group                opcional     int
#   parallel_with                 opcional     list[string]
#   input                         opcional     mapping (estrutura livre)
#   output_path                   opcional     string
#   output_type                   opcional     enum
#   acceptance_criteria           obrigatório  list[string]
#   artifacts                     opcional     list[object]
#     path                        obrigatório  string
#     type                        obrigatório  enum
#     produced_at                 opcional     date
#   created_at                    obrigatório  date
#   started_at                    opcional     date
#   completed_at                  opcional     date
#   estimated_duration_minutes    opcional     int
#   attempts                      opcional     int
#   last_error                    opcional     string
#   notes                         opcional     string

# Valores válidos para enums:
#
#   status: [pending, in_progress, completed, blocked, failed, cancelled]
#   priority: [LOW, MEDIUM, HIGH, CRITICAL]
#   mode: [READ, WRITE, MECHANICAL, REVIEW]
#   owner: [human, agent, shared]
#   output_type: [structured_yaml, structured_json, markdown_report, diff_patch, file_modification, other]
#   artifacts.type: [yaml, json, md, bib, diff, other]

# ============================================================
# Exemplo completo (válido YAML, descomentar para usar)
# ============================================================

# ---
